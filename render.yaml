databases:
  - name: AlgoTradingAPI-DB
    databaseName: algo_trading_app_production
    user: nemesis
    plan: free

services:
  - type: web
    name: algo_trading_api
    runtime: ruby
    # Matches the plan the service actually runs on. Left at `free`, a blueprint
    # sync tries to downgrade it, and a free service also sleeps when idle —
    # which stops the in-process token refresh thread along with everything else.
    plan: starter
    buildCommand: "./bin/render-build.sh"
    # Bind explicitly: Render routes to $PORT, and a server left on the default
    # port or on localhost fails the health check even though the app booted.
    startCommand: "bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:${PORT}"
    # /up is Rails' built-in health endpoint (see config/routes.rb). Without it
    # Render probes /, which this API does not serve, and marks the deploy
    # unhealthy.
    healthCheckPath: /up
    envVars:
      # A DATABASE_URL set in the dashboard overrides this, which is how the
      # service currently points at an external CockroachDB instance rather
      # than the Render database declared above.
      - key: DATABASE_URL
        fromDatabase:
          name: AlgoTradingAPI-DB
          property: connectionString

      # Encrypt the database connection without verifying the certificate.
      # This is the default in config/database.yml; it is repeated here so a
      # blueprint sync clears a verify-full left over in the dashboard, which
      # fails against a Render database on every deploy:
      #   SSL error: certificate verify failed
      # Render issues the certificate from its own CA and the internal endpoint
      # answers on a private address the certificate does not name, so the
      # system trust store can verify neither. To verify anyway, set
      # verify-full here and DATABASE_SSLROOTCERT to the provider's CA bundle.
      # `disable` is for a local proxy that already terminated TLS.
      - key: DATABASE_SSLMODE
        value: require

      - key: RAILS_ENV
        value: production
      # Rails refuses to boot in production without this.
      - key: SECRET_KEY_BASE
        generateValue: true
      # Otherwise logs are written to log/production.log inside the container
      # and never reach the Render dashboard.
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      # Starter is a 512 MB container, so two workers is the ceiling — Puma
      # preloads the app and each fork drifts off its own copy-on-write pages.
      - key: WEB_CONCURRENCY
        value: "2"

      # Dhan API key auth (one-time login at /auth/dhan/login; token stored in DB)
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_API_KEY
        sync: false
      - key: DHAN_API_SECRET
        sync: false

      # TOTP handshake credentials. Dhan::TokenManager mints and refreshes the
      # access token itself, and reads both with a strict ENV.fetch — without
      # them the boot-time refresh dies with a bare KeyError before it ever
      # reaches auth.dhan.co. DHAN_TOTP_SECRET is the base32 secret from the
      # authenticator-app setup, not a 6-digit code.
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false

      # Order placement stays off unless deliberately enabled: both must be
      # "true" before anything reaches the broker (see Orders::Gateway).
      - key: PLACE_ORDER
        value: "false"
      - key: LIVE_TRADING
        value: "false"
      # Routes Orders::Gateway to the simulated exchange instead. On here so a
      # TradingView webhook or a Telegram signal hitting the web service books
      # into the same paper account the engine below trades, rather than being
      # dropped by the two gates above.
      - key: PAPER_TRADING
        value: "true"
      # Starting capital for the simulated book, in rupees. Only applies when
      # the account row is first created — `rails live:paper_capital` applies a
      # change to a book that already exists.
      - key: PAPER_CAPITAL
        value: "100000"
      # The web service serves webhooks; it does not scan. The engine worker
      # owns the scan loop, because Live::TickCache is process-local and Puma
      # runs WEB_CONCURRENCY forks that would each open their own feed.
      - key: INDEX_WATCHLIST_TRADING
        value: "false"

      # Set to "true" to run this deployment as a bare Dhan token provider:
      # ApplicationController 503s every route except /auth/dhan/*, so other
      # apps/bots can call GET /auth/dhan/token for an always-fresh access
      # token without this instance placing a single order. TokenManager's
      # boot-time refresh and the 5-minute background refresh thread are
      # unaffected and keep the token current either way. If you flip this on,
      # also suspend (or never sync) the algo_trading_paper_engine worker
      # below — it places orders on its own initiative and has no use here.
      - key: TOKEN_PROVIDER_ONLY
        value: "false"

      # LLM backend. Blank = OpenAI; ollama_cloud uses OLLAMA_API_KEY_1..5.
      - key: LLM_BACKEND
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_API_KEY_1
        sync: false
      - key: OLLAMA_API_KEY_2
        sync: false

      # Build-time toggles, both optional:
      #   IMPORT_INSTRUMENTS_ON_DEPLOY=true  download the scrip master (slow)
      #   SKIP_SEEDS_ON_DEPLOY=true          skip the idempotent seed step
      # The seed step carries the index segment of the scrip master, so leaving
      # the import off still leaves NIFTY/BANKNIFTY/SENSEX resolvable; skipping
      # the seeds as well leaves the instrument master empty and every symbol
      # lookup missing.
      - key: IMPORT_INSTRUMENTS_ON_DEPLOY
        sync: false
      - key: SKIP_SEEDS_ON_DEPLOY
        sync: false

  # ─────── Paper-trading engine (market feed + index watchlist scanner) ────
  #
  # ⚠ Declaring this service here does not create it. Pushing to the branch
  # auto-deploys the services that already exist; a service that is new in the
  # blueprint is only created when the blueprint is synced from the Render
  # dashboard (Blueprints → this blueprint → Sync). Until that sync happens
  # there is no worker, no build and no log stream — the dashboard simply shows
  # nothing for it, which reads exactly like a service that started and stayed
  # quiet. If this engine appears not to have run for a session, check that the
  # service exists at all before reading anything into its empty log.
  #
  # After the sync, every `sync: false` key below still has to be filled in on
  # *this* service — services do not share environment, so the DHAN_* values
  # set on the web service are not visible here. Missing DHAN_CLIENT_ID /
  # DHAN_PIN / DHAN_TOTP_SECRET make `ENV.fetch` raise inside
  # `start_token_refresher`, which aborts the process on boot; that abort goes
  # to stderr and is visible immediately, so a log showing it means the sync
  # worked and only the variables are missing.
  #
  # One process, deliberately. `Live::TickCache` is a process-local Hash (see
  # the instrument-master notes in CLAUDE.md — the measurement behind that
  # choice), and in paper mode the tick stream is what fills resting orders,
  # marks positions, and drives Paper::DayRollover / Paper::EodSquareOff. A
  # scanner in one process and a feed in another would place orders nothing
  # ever fills. The web service cannot host the feed either: Puma runs
  # WEB_CONCURRENCY=2 forks and each would open its own WebSocket.
  #
  # Every DHAN_* value below is `sync: false`, so set them on this service in
  # the dashboard as well as on the web service — they are separate services
  # and do not share environment.
  - type: worker
    name: algo_trading_paper_engine
    runtime: ruby
    plan: starter
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rake live:paper_engine"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: AlgoTradingAPI-DB
          property: connectionString
      - key: DATABASE_SSLMODE
        value: require
      - key: RAILS_ENV
        value: production
      # Need not match the web service's — this process serves no cookies and
      # verifies no signed message; it only has to be present so Rails boots.
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # The build script's optional steps are the web service's job.
      - key: SKIP_SEEDS_ON_DEPLOY
        value: "true"

      # Simulated book only. `live:paper_engine` aborts on boot unless
      # PAPER_TRADING is on, because this process places orders on its own
      # initiative — it must never be one env var away from doing that live.
      - key: PAPER_TRADING
        value: "true"
      - key: PAPER_CAPITAL
        value: "100000"
      - key: PLACE_ORDER
        value: "false"
      - key: LIVE_TRADING
        value: "false"

      # The scan loop. INDEX_WATCHLIST_TRADING is what actually lets a
      # confluence signal become an order; with it off the engine still runs
      # the feed, the book and the Telegram alerts, and places nothing.
      - key: INDEX_WATCHLIST
        value: "NIFTY,BANKNIFTY,SENSEX"
      - key: INDEX_WATCHLIST_TRADING
        value: "true"
      # :high is 8 of 14 confluence factors agreeing. :medium (5) fires several
      # times a session and is a notification-grade signal, not a trade.
      - key: INDEX_WATCHLIST_MIN_LEVEL
        value: "high"
      - key: INDEX_WATCHLIST_MAX_TRADES_PER_DAY
        value: "3"
      - key: INDEX_WATCHLIST_COOLDOWN_MINUTES
        value: "30"
      # Matches the 5-minute candles the score is computed on.
      - key: INDEX_WATCHLIST_SCAN_SECONDS
        value: "180"

      # Same credentials as the web service, set separately on this one.
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_API_KEY
        sync: false
      - key: DHAN_API_SECRET
        sync: false
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false

      # Without a chat id the scanner still trades; it just does so silently.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # ─────── Crypto SMC/ICT scanner — NOT DEPLOYED ──────────────────────────
  #
  # Deliberately absent, not forgotten. Binance answers `HTTP 451 — Service
  # unavailable from a restricted location` to Render's egress IPs, so a worker
  # here would boot, fail every fetch, and alert nothing. Paying for a service
  # that cannot reach its only data source is worse than not running it.
  #
  # The code stays in the repo and is fully tested; it is simply inert on this
  # deployment. Every switch it needs defaults to false, so nothing about the
  # DhanHQ services above is affected:
  #
  #   CRYPTO_SMC_ENABLED=false     master switch (Crypto::Config.enabled?)
  #   CRYPTO_SMC_AUTOSTART=false   in-Puma listener thread
  #   config/recurring.yml         crypto entry commented out
  #
  # Run it where Binance is reachable — a laptop, or a host in a permitted
  # region — with `rails crypto:doctor` first and then `rails crypto:stream`.
  # See docs/CRYPTO_SMC.md. If a permitted endpoint ever becomes available from
  # Render, the service below is what to uncomment; set CRYPTO_BINANCE_BASE to
  # it and flip CRYPTO_SMC_ENABLED to "true".
  #
  # - type: worker
  #   name: algo_trading_crypto_scanner
  #   runtime: ruby
  #   plan: starter
  #   buildCommand: "./bin/render-build.sh"
  #   startCommand: "bundle exec rake crypto:stream"
  #   envVars:
  #     # Rails.cache is solid_cache and the scanner boots the full app, so the
  #     # database has to be reachable even though it persists nothing itself.
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: AlgoTradingAPI-DB
  #         property: connectionString
  #     - key: DATABASE_SSLMODE
  #       value: require
  #     - key: RAILS_ENV
  #       value: production
  #     # Need not match the web service's — this process serves no cookies and
  #     # verifies no signed message; it only has to be present so Rails boots.
  #     - key: SECRET_KEY_BASE
  #       generateValue: true
  #     - key: RAILS_LOG_TO_STDOUT
  #       value: "true"
  #     # The build script's optional steps are the web service's job.
  #     - key: SKIP_SEEDS_ON_DEPLOY
  #       value: "true"
  #
  #     - key: CRYPTO_SMC_ENABLED
  #       value: "true"
  #     - key: CRYPTO_SMC_SYMBOLS
  #       value: "SOLUSDT,ETHUSDT"
  #     - key: CRYPTO_SMC_STREAM_TIMEFRAMES
  #       value: "5m,15m"
  #     - key: CRYPTO_SMC_MIN_SCORE
  #       value: "62"
  #     - key: CRYPTO_SMC_MIN_RR
  #       value: "1.8"
  #     - key: CRYPTO_SMC_COOLDOWN_MINUTES
  #       value: "45"
  #     # How a 451 or a dead feed becomes visible: without it, an outage is
  #     # indistinguishable from a quiet market.
  #     - key: CRYPTO_SMC_HEALTH_ALERTS
  #       value: "true"
  #     # Required from Render — the default endpoint is geo-blocked here.
  #     - key: CRYPTO_BINANCE_BASE
  #       sync: false
  #
  #     - key: CRYPTO_TELEGRAM_CHAT_ID
  #       sync: false
  #     - key: TELEGRAM_BOT_TOKEN
  #       sync: false
  #     - key: TELEGRAM_CHAT_ID
  #       sync: false
  #
  #     # The analyst step. Off leaves alerts with deterministic levels only.
  #     - key: CRYPTO_SMC_LLM
  #       value: "true"
  #     - key: CRYPTO_SMC_LLM_MODEL
  #       sync: false
  #     - key: LLM_BACKEND
  #       sync: false
  #     - key: OLLAMA_API_KEY_1
  #       sync: false
  #
  #     # Belt and braces: this process must never reach a broker.
  #     - key: PLACE_ORDER
  #       value: "false"
  #     - key: LIVE_TRADING
  #       value: "false"

