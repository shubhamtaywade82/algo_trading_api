databases:
  - name: AlgoTradingAPI-DB
    databaseName: algo_trading_app_production
    user: nemesis
    plan: free

services:
  - type: web
    name: algo_trading_api
    runtime: ruby
    # Matches the plan the service actually runs on. Left at `free`, a blueprint
    # sync tries to downgrade it, and a free service also sleeps when idle —
    # which stops the in-process token refresh thread along with everything else.
    plan: starter
    buildCommand: "./bin/render-build.sh"
    # Bind explicitly: Render routes to $PORT, and a server left on the default
    # port or on localhost fails the health check even though the app booted.
    startCommand: "bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:${PORT}"
    # /up is Rails' built-in health endpoint (see config/routes.rb). Without it
    # Render probes /, which this API does not serve, and marks the deploy
    # unhealthy.
    healthCheckPath: /up
    envVars:
      # A DATABASE_URL set in the dashboard overrides this, which is how the
      # service currently points at an external CockroachDB instance rather
      # than the Render database declared above.
      - key: DATABASE_URL
        fromDatabase:
          name: AlgoTradingAPI-DB
          property: connectionString

      # Encrypt the database connection without verifying the certificate.
      # This is the default in config/database.yml; it is repeated here so a
      # blueprint sync clears a verify-full left over in the dashboard, which
      # fails against a Render database on every deploy:
      #   SSL error: certificate verify failed
      # Render issues the certificate from its own CA and the internal endpoint
      # answers on a private address the certificate does not name, so the
      # system trust store can verify neither. To verify anyway, set
      # verify-full here and DATABASE_SSLROOTCERT to the provider's CA bundle.
      # `disable` is for a local proxy that already terminated TLS.
      - key: DATABASE_SSLMODE
        value: require

      - key: RAILS_ENV
        value: production
      # Rails refuses to boot in production without this.
      - key: SECRET_KEY_BASE
        generateValue: true
      # Otherwise logs are written to log/production.log inside the container
      # and never reach the Render dashboard.
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      # Starter is a 512 MB container, so two workers is the ceiling — Puma
      # preloads the app, and each fork adds its own copy-on-write drift on top
      # of the ~200 MB the scrip-master index takes once it is imported.
      - key: WEB_CONCURRENCY
        value: "2"

      # Dhan API key auth (one-time login at /auth/dhan/login; token stored in DB)
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_API_KEY
        sync: false
      - key: DHAN_API_SECRET
        sync: false

      # TOTP handshake credentials. Dhan::TokenManager mints and refreshes the
      # access token itself, and reads both with a strict ENV.fetch — without
      # them the boot-time refresh dies with a bare KeyError before it ever
      # reaches auth.dhan.co. DHAN_TOTP_SECRET is the base32 secret from the
      # authenticator-app setup, not a 6-digit code.
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false

      # Order placement stays off unless deliberately enabled: both must be
      # "true" before anything reaches the broker (see Orders::Gateway).
      - key: PLACE_ORDER
        value: "false"
      - key: LIVE_TRADING
        value: "false"
      # Routes Orders::Gateway to the simulated exchange instead.
      - key: PAPER_TRADING
        value: "false"

      # LLM backend. Blank = OpenAI; ollama_cloud uses OLLAMA_API_KEY_1..5.
      - key: LLM_BACKEND
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_API_KEY_1
        sync: false
      - key: OLLAMA_API_KEY_2
        sync: false

      # Build-time toggles, both optional:
      #   IMPORT_INSTRUMENTS_ON_DEPLOY=true  download the scrip master (slow)
      #   SKIP_SEEDS_ON_DEPLOY=true          skip the idempotent seed step
      - key: IMPORT_INSTRUMENTS_ON_DEPLOY
        sync: false
      - key: SKIP_SEEDS_ON_DEPLOY
        sync: false

